[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["security", "venv", "results", "data"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = flake8-bugbear, UP = pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["security/", "venv/", "results/", "data/"]
